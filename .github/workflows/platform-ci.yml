name: SynapseMD Platform CI

on:
  push:
    paths:
      - "platform/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapsemd
          POSTGRES_PASSWORD: synapsemd
          POSTGRES_DB: synapsemd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapsemd -d synapsemd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: postgresql+asyncpg://synapsemd:synapsemd@localhost:5432/synapsemd_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e "./platform[dev]"
          pip install pytest pytest-cov pytest-asyncio ruff pip-audit

      - name: Lint
        run: ruff check platform/synapsemd_platform tests

      - name: Unit and integration tests with coverage
        run: pytest tests/ -v --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Dependency audit
        working-directory: platform
        run: pip-audit || true

  release-gates:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapsemd
          POSTGRES_PASSWORD: synapsemd
          POSTGRES_DB: synapsemd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapsemd -d synapsemd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: postgresql+asyncpg://synapsemd:synapsemd@localhost:5432/synapsemd_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e "./platform[dev]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Release gate tests
        run: pytest tests/release/ -v

      - name: Model eval regression tests
        run: pytest tests/eval/ -v
